[project]
name = "unimilib"
version = "0.1.0"
description = "python library to interact with the Unimi library portal"
authors = [
    {name = "fla"}
]
license = "MIT"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic (>=2.14.3,<3.0.0)",
    "httpx2 (>=2.16.2,<3.0.0)",
    "browserforge (>=1.2.4,<2.0.0)",
    "async-lru (>=2.4.0,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    
    "F",     
    "I",     
    "B",     
    "UP",    
    "ASYNC", 
]

[tool.ruff.lint.isort]
known-first-party = ["unimilib"]  

[tool.poetry]
packages = [{ include = "unimilib", from = "src" }]